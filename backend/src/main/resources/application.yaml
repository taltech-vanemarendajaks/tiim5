server: 
  port: ${BACKEND_PORT}

spring:
  application:
    name: study-planner
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      schema: studyplanner
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog.xml
    liquibase-schema: studyplanner

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api/docs