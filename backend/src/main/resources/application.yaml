server: 
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: study-planner
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studyplanner}
    username: ${POSTGRES_USER:local}
    password: ${POSTGRES_PASSWORD:password}
    hikari:
      schema: studyplanner
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog.xml
    liquibase-schema: studyplanner
  jpa:
    show-sql: ${SQL_ENABLED:false}

ois:
  base-url: "https://ois2.ut.ee/api"
  
springdoc:
  swagger-ui:
    path: /docs
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
  api-docs:
    path: /api/docs
    enabled:  ${SPRINGDOC_API_DOCS_ENABLED:true}