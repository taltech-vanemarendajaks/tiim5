spring:
  application:
    name: study-planner
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      schema: studyplanner
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog.xml
    liquibase-schema: studyplanner
  jpa:
    show-sql: ${SQL_ENABLED}

ois:
  base-url: "https://ois2.ut.ee/api"
  
springdoc:
  swagger-ui:
    path: /docs
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED}
  api-docs:
    path: /api/docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED}