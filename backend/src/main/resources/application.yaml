server: 
  port: 8080

spring:
  application:
    name: study-planner
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog.xml
    liquibase-schema: studyplanner
  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api/docs