$kind: http-request
name: getCourseByCourseExternalId
description: >-
  Maybe we should have a lookup with just the course code.  

  As the user doesnt know the course uuid, but only the course code.


  Also i think many courses may share the same code but have different versions.
  But i think we have to always serve the latest courses from our endpoint and
  use the ois endpoint /api/courses/latest internally. Perhaps this way we wont
  have to worry about course versioning in our app.
url: "{{host}}/courses/:course_external_id"
method: GET
pathVariables:
  course_external_id: ""
order: 1774449775054
