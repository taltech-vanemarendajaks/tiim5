$kind: http-request
name: updateUser
url: "{{host}}/users/:userExternalId"
method: PATCH
pathVariables:
  userExternalId: ""
body:
  type: formdata
  content:
    - type: text
      key: name
      value: ""
      description: ""
      disabled: false
    - type: text
      key: curriculum_id
      value: ""
      description: ""
      disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
