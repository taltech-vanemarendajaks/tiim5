$kind: http-request
name: getUserStudyPlans
description: >-
  Currently we have in codebase  
    
  @GetMapping("/study-plans/{studyPlanExternalId}/semesters")  
    
  but i feel like we could replace it with
  "/study-plans/{studyPlanExternalId}/"  

  because i imagine a study-plan is already a list of semesters that have n
  amount of plannedCourses.  
    
  a case could be made for adding  

  POST AND GET ("/study-plans/{studyPlanExternalId}/semesters/:semesterId")  

  But i feel like for the front-end app it might be easier to send the entire
  plan, rather than a singular semester
url: "{{host}}/users/:userExternalId/study-plans"
method: GET
pathVariables:
  userExternalId: ""
order: 6000
