services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend-prod
    env_file:
      - .env
    ports:
      - ${FRONTEND_PORT}:4000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-backend
      target: production
    container_name: backend_prod
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./backend/.env
    ports:
      - ${BACKEND_PORT}:8080
    environment:
      SPRINGDOC_API_DOCS_ENABLED: false
      SPRINGDOC_SWAGGER_UI_ENABLED: false
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:${DB_PORT}/${POSTGRES_DB}

  db:
    build:
      context: ./backend
      dockerfile: Dockerfile-db
    container_name: postgres_db_prod
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - ${DB_PORT}:5432
    volumes:
      - studyplanner_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studyplanner_postgres_data:
