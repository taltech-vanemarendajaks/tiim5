services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend-prod
    restart: unless-stopped
    ports:
      - 4000:4000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-backend
      target: production
    container_name: backend-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      SQL_ENABLED: false
      SPRINGDOC_API_DOCS_ENABLED: false
      SPRINGDOC_SWAGGER_UI_ENABLED: false
    ports:
      - 8080:8080

  db:
    build:
      context: ./backend
      dockerfile: Dockerfile-db
    container_name: postgres-db-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - 5432:5432
    volumes:
      - studyplanner_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studyplanner_postgres_data:
