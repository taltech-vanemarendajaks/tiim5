<div class="layout">
  <aside class="sidebar" [attr.aria-label]="'Nav.AriaLabel' | t">
    <div class="sidebar__brand">
      <h1 class="sidebar__title">{{ 'App.Name' | t }}</h1>
      <p class="sidebar__user">{{ 'App.UserPlaceholder' | t }}</p>
    </div>

    <nav class="sidebar__nav">
      <ul>
        @for (item of mainNav; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              class="sidebar__link"
            >
              <fa-icon ngSkipHydration [icon]="item.icon" class="sidebar__icon" />
              <span class="sidebar__label">{{ item.labelKey | t }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar__footer">
      <a
        [routerLink]="settingsNav.path"
        routerLinkActive="is-active"
        class="sidebar__link"
      >
        <fa-icon ngSkipHydration [icon]="settingsNav.icon" class="sidebar__icon" />
        <span class="sidebar__label">{{ settingsNav.labelKey | t }}</span>
      </a>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
