name: CD - Deploy

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push db image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile-db
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/studyplanner-db:latest

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile-backend
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/studyplanner-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/studyplanner-frontend:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/tiim5
            docker compose pull
            docker compose up -d
            docker image prune -f